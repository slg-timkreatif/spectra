<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPECTRA — Panel Operator</title>
<link rel="stylesheet" href="spectra-theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="spectra-ui.js"></script>
<script>initTheme('light')</script>
<style>
  main{max-width:1120px;margin:0 auto;padding:1rem 1rem 130px}
  .matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:170px}
  .matrix thead th:first-child{background:var(--surface-2)}
  .aksiCell{display:flex;gap:.4rem;align-items:center;justify-content:center}
  .jChip{display:flex;gap:.5rem;align-items:center;border:1px solid var(--border-2);border-radius:10px;
         padding:.4rem .7rem;font-size:.78rem;color:var(--text-2);background:var(--surface-2)}
  .jChip.draft{border-color:var(--warning);color:var(--warn-text);background:var(--warning-soft)}
  .jChip.final{border-color:var(--success);color:var(--ok-text);background:var(--success-soft)}
  .juriRow{display:flex;gap:.5rem;flex-wrap:wrap;margin:.7rem 0}
  .pFoot{display:flex;justify-content:space-between;align-items:center;gap:.8rem}
  .tot small{color:var(--text-3);font-size:.62rem;letter-spacing:2px;display:block}
  .tot b{font-size:1.35rem;color:var(--primary-text);font-variant-numeric:tabular-nums}
  @media(min-width:761px){ .cards{display:none} }
  @media(max-width:760px){ .table-wrap{display:none} }
</style>
</head>
<body>

<header class="topbar"><div class="topbar-in">
  <div class="brand">
    <div class="brand-logo"><i data-lucide="shield-check"></i></div>
    <div><b id="hEvent">SPECTRA</b><small id="hCabang">Panel Kontrol Operator</small></div>
  </div>
  <div class="topbar-actions">
    <span id="conn"></span>
    <button class="btn btn-ghost btn-icon" onclick="muat()" title="Segarkan data"><i data-lucide="refresh-cw"></i></button>
    <button class="btn btn-ghost btn-icon" onclick="toggleTheme()" title="Ganti tema"><i id="icTheme" data-lucide="moon"></i></button>
    <button class="btn btn-ghost btn-icon" onclick="keluarSpectra()" title="Keluar"><i data-lucide="log-out"></i></button>
  </div>
</div></header>

<main>
  <div class="stat-grid">
    <div class="stat"><i data-lucide="users"></i><div><b id="stP">0</b><small>Peserta</small></div></div>
    <div class="stat proc"><i data-lucide="pencil-line"></i><div><b id="stPr">0</b><small>Proses</small></div></div>
    <div class="stat ok"><i data-lucide="badge-check"></i><div><b id="stF">0</b><small>Final</small></div></div>
    <div class="stat warn"><i data-lucide="alert-triangle"></i><div><b id="stW">0</b><small>⚠ Juri</small></div></div>
  </div>

  <div class="alert alert-warn" id="warnBox" hidden></div>

  <!-- DESKTOP: MATRIKS -->
  <div class="table-wrap">
    <table class="matrix">
      <thead id="mHead"></thead>
      <tbody id="mBody"></tbody>
    </table>
  </div>

  <!-- MOBILE: KARTU -->
  <div class="cards" id="cards"></div>

  <div class="card empty" id="empty" hidden>
    <i data-lucide="clipboard-list"></i>
    <p>Belum ada peserta di cabang ini.</p>
  </div>

  <div class="card" id="fatal" hidden>
    <p id="fatalTxt" class="muted"></p>
    <button class="btn btn-primary btn-block" onclick="location.href='spectra-login.html'">Ke Halaman Login</button>
  </div>
</main>

<div class="bottombar">
  <div class="bottombar-in" style="align-items:center">
    <div style="flex:1;font-size:.83rem;color:var(--text-2)" id="ringkasan">Memuat...</div>
    <button class="btn btn-primary" id="btnBatch" onclick="sahkanLengkap()" disabled>
      <i data-lucide="badge-check"></i><span>Sahkan Semua Lengkap</span>
    </button>
  </div>
</div>

<script>
const sesi = bacaSesi();
let DATA = null, ROWS = [];

const fatal = m => { document.getElementById('fatal').hidden = false; document.getElementById('fatalTxt').textContent = m; };

(async function boot() {
  if (!sesi) { location.href = 'spectra-login.html'; return; }
  if (sesi.peran !== 'OPERATOR') return fatal('Halaman ini khusus OPERATOR. Sesi Anda: ' + sesi.peran + '.');
  document.getElementById('hEvent').textContent = sesi.nama_event;
  document.getElementById('hCabang').textContent = (sesi.nama_cabang || '') + ' • Panel Operator';
  document.getElementById('icTheme').setAttribute('data-lucide', themeIcon());
  initConn('conn');
  await muat();
  setInterval(() => { if (navigator.onLine) muat(true); }, 45000); // auto-refresh hemat kuota
})();

async function muat(senyap) {
  try {
    const { data, error } = await (await sb()).rpc('spectra_get_operator_data', { p_kode_akses: sesi.kode_akses });
    if (error) throw error;
    if (data && data.error) return fatal(data.error);
    DATA = data;
    render();
  } catch (e) {
    if (!senyap) fatal('Gagal memuat data: ' + e.message);
  }
}

function render() {
  const juri = DATA.juri || [], peserta = DATA.peserta || [], nilai = DATA.nilai || [];
  const byP = {};
  nilai.forEach(n => { (byP[n.peserta_id] = byP[n.peserta_id] || {})[n.petugas_id] = n; });

  let nPr = 0, nFin = 0, nWarn = 0;
  ROWS = peserta.map(p => {
    const nm = byP[p.id] || {};
    const rws = Object.values(nm);
    const dinilai = rws.length;
    const nFinal = rws.filter(r => r.status === 'FINAL').length;
    const total = rws.reduce((a, r) => a + Number(r.total || 0), 0);
    const lengkap = dinilai === juri.length;
    const allFinal = dinilai > 0 && nFinal === dinilai;
    if (allFinal) nFin++; else if (dinilai > 0) nPr++;
    if (!lengkap) nWarn++;
    return { p, nm, dinilai, total, lengkap, allFinal };
  });

  document.getElementById('stP').textContent = peserta.length;
  document.getElementById('stPr').textContent = nPr;
  document.getElementById('stF').textContent = nFin;
  document.getElementById('stW').textContent = nWarn;

  const wb = document.getElementById('warnBox');
  if (nWarn > 0) {
    wb.hidden = false;
    wb.innerHTML = '<i data-lucide="alert-triangle"></i><span>' + nWarn + ' peserta belum dinilai lengkap ' +
      juri.length + ' juri. Dengan metode TOTAL, sahkan hanya setelah jumlah juri konsisten.</span>';
  } else wb.hidden = true;

  /* ----- Matriks desktop ----- */
  document.getElementById('mHead').innerHTML =
    '<tr><th>Peserta</th>' + juri.map(j => '<th>' + j.nama + '</th>').join('') +
    '<th>Total</th><th>Status</th><th style="text-align:center">Aksi</th></tr>';
  document.getElementById('mBody').innerHTML = ROWS.map(r =>
    '<tr><td><b>' + r.p.nomor_undian + '. ' + r.p.nama_peserta + '</b><br>' +
    '<small class="muted">' + (r.p.asal_instansi || '') + (r.p.nama_kategori ? ' • ' + r.p.nama_kategori : '') + '</small></td>' +
    juri.map(j => {
      const v = r.nm[j.id];
      return '<td>' + (v
        ? '<span class="mcell ' + (v.status === 'FINAL' ? 'final' : 'draft') + ' tnum">' + v.total + '</span>'
        : '<span class="mcell none">–</span>') + '</td>';
    }).join('') +
    '<td class="tnum"><b>' + r.total + '</b></td>' +
    '<td><span class="badge ' + (r.allFinal ? 'ok' : r.dinilai ? 'proc' : 'none') + '">' +
    (r.allFinal ? 'FINAL' : r.dinilai ? 'PROSES' : 'BELUM') + '</span></td>' +
    '<td><div class="aksiCell">' + (r.lengkap ? '' : '<span class="badge warn tnum">' + r.dinilai + '/' + juri.length + '</span>') +
    btnAksi(r) + '</div></td></tr>').join('');

  /* ----- Kartu mobile ----- */
  document.getElementById('cards').innerHTML = ROWS.map(r =>
    '<div class="card" style="margin-bottom:.8rem">' +
    '<div class="card-head"><div><h3 style="font-size:1rem">' + r.p.nomor_undian + '. ' + r.p.nama_peserta + '</h3>' +
    '<span class="muted small">' + (r.p.asal_instansi || '-') + ' • ' + (r.p.nama_kategori || 'Umum') + '</span></div>' +
    '<span class="badge ' + (r.lengkap ? 'ok' : 'warn') + ' tnum">Juri ' + r.dinilai + '/' + juri.length + '</span></div>' +
    '<div class="juriRow">' + juri.map(j => {
      const v = r.nm[j.id];
      return '<span class="jChip ' + (v ? (v.status === 'FINAL' ? 'final' : 'draft') : '') + '">' + j.nama + ': ' +
        (v ? (v.status === 'FINAL' ? '🟢 ' : '🟡 ') + v.total : '⬜ belum') + '</span>';
    }).join('') + '</div>' +
    '<div class="pFoot"><div class="tot"><small>TOTAL GABUNGAN</small><b>' + r.total + '</b></div>' +
    btnAksi(r, true) + '</div></div>').join('');

  document.getElementById('empty').hidden = peserta.length > 0;

  const batch = ROWS.filter(r => r.dinilai > 0 && r.lengkap && !r.allFinal);
  document.getElementById('btnBatch').disabled = batch.length === 0;
  document.getElementById('ringkasan').innerHTML =
    '<b class="tnum">' + nFin + '</b> FINAL • <b class="tnum">' + nPr + '</b> proses • <b class="tnum">' + nWarn + '</b> ⚠ juri';
  icons();
}

function btnAksi(r, lebar) {
  const cls = lebar ? 'btn' : 'btn btn-icon';
  if (r.allFinal)
    return '<button class="' + cls + ' btn-warn" title="Buka kunci" onclick="validasi(\'' + r.p.id + '\',\'DRAFT\')"><i data-lucide="lock-open"></i>' + (lebar ? '<span> Buka Kunci</span>' : '') + '</button>';
  if (r.dinilai > 0)
    return '<button class="' + cls + ' btn-primary" title="Sahkan" onclick="validasi(\'' + r.p.id + '\',\'FINAL\')"><i data-lucide="shield-check"></i>' + (lebar ? '<span> Sahkan Final</span>' : '') + '</button>';
  return '<button class="' + cls + ' btn-ghost" disabled><i data-lucide="minus"></i>' + (lebar ? '<span> Belum ada nilai</span>' : '') + '</button>';
}

async function validasi(pesertaId, status) {
  const r = ROWS.find(x => x.p.id === pesertaId);
  if (status === 'FINAL' && !r.lengkap) {
    const ok = await spectraConfirm({
      judul: 'Juri belum lengkap',
      pesan: 'Peserta "' + r.p.nama_peserta + '" baru dinilai ' + r.dinilai + ' dari ' +
        (DATA.juri || []).length + ' juri. Dengan metode TOTAL, nilai ini mungkin tidak adil. Sahkan tetap?',
      teksYa: 'Sahkan Tetap', bahaya: true
    });
    if (!ok) return;
  }
  if (status === 'DRAFT') {
    const ok = await spectraConfirm({ judul: 'Buka kunci?', pesan: 'Nilai "' + r.p.nama_peserta + '" akan kembali ke DRAFT dan hilang dari livescore.', teksYa: 'Buka Kunci' });
    if (!ok) return;
  }
  const { error } = await (await sb()).rpc('spectra_validasi_operator', {
    p_kode_akses: sesi.kode_akses, p_cabang_id: sesi.cabang_id,
    p_peserta_id: pesertaId, p_status: status
  });
  if (error) return toast('Gagal: ' + error.message, 'err');
  toast(status === 'FINAL' ? 'Nilai disahkan FINAL.' : 'Kunci dibuka.', 'ok');
  await muat(true);
}

async function sahkanLengkap() {
  const list = ROWS.filter(r => r.dinilai > 0 && r.lengkap && !r.allFinal);
  if (!list.length) return;
  const ok = await spectraConfirm({
    judul: 'Sahkan ' + list.length + ' peserta?',
    pesan: 'Hanya peserta dengan juri lengkap yang akan disahkan menjadi FINAL dan tampil di livescore.',
    teksYa: 'Sahkan Semua'
  });
  if (!ok) return;
  let n = 0;
  for (const r of list) {
    const { error } = await (await sb()).rpc('spectra_validasi_operator', {
      p_kode_akses: sesi.kode_akses, p_cabang_id: sesi.cabang_id,
      p_peserta_id: r.p.id, p_status: 'FINAL'
    });
    if (!error) n++;
  }
  toast(n + ' peserta disahkan FINAL.', 'ok');
  await muat(true);
}
</script>
</body>
</html>

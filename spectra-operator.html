<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPECTRA — Panel Operator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="spectra-theme.css?v=2">
<script src="vendor/supabase.min.js"></script>
<script src="vendor/lucide.min.js"></script>
<script>if(!window.lucide) document.write('<script src="https://unpkg.com/lucide@latest"><\/script>')</script>
<script src="spectra-ui.js?v=2"></script>
<script>initTheme('light')</script>
<style>
  main{max-width:1120px;margin:0 auto;padding:1rem 1rem 7.5rem}
  .matrix-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
  .matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:170px}
  .matrix thead th:first-child{background:var(--surface-2)}
  @media(max-width:760px){.matrix-wrap{display:none}}
  @media(min-width:761px){.cards{display:none}}
  .cards .card{margin-bottom:.8rem}
  .jChips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.7rem 0}
  .jChip{display:flex;gap:.45rem;align-items:center;border:1px solid var(--border-2);border-radius:10px;
         padding:.4rem .7rem;font-size:.78rem;color:var(--text-2);background:var(--surface-2)}
  .jChip.draft{border-color:var(--warning);color:var(--warn-text);background:var(--warning-soft)}
  .jChip.final{border-color:var(--success);color:var(--ok-text);background:var(--success-soft)}
  .pFoot{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap}
  .tot small{color:var(--text-3);font-size:.62rem;letter-spacing:2px;display:block}
  .tot b{font-size:1.35rem;color:var(--primary-text)}
  .aksiCell{display:flex;gap:.4rem;align-items:center;justify-content:center}

  /* Rekap Modal */
  .rekap-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:none;align-items:flex-start;justify-content:center;padding:1rem;overflow-y:auto}
  .rekap-overlay.show{display:flex}
  .rekap-modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:900px;margin:1rem auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .rekap-head{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;border-radius:var(--r-lg) var(--r-lg) 0 0}
  .rekap-head h2{margin:0;font-size:1.1rem;display:flex;align-items:center;gap:.5rem}
  .rekap-actions{display:flex;gap:.5rem}
  .rekap-body{padding:1.5rem;max-height:75vh;overflow-y:auto}

  /* BA Table Styles */
  .ba-header{text-align:center;margin-bottom:1.5rem}
  .ba-header h3{margin:0;font-size:1rem;text-transform:uppercase;letter-spacing:1px}
  .ba-header h4{margin:.3rem 0;font-size:1.2rem;font-weight:700}
  .ba-header p{margin:.2rem 0;font-size:.85rem;color:var(--text-2)}
  .ba-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem;margin-bottom:1rem;padding:.8rem;background:var(--surface-2);border-radius:var(--r);font-size:.85rem}
  .ba-info span{color:var(--text-2)}
  .ba-info b{color:var(--text)}

  .ba-table{width:100%;border-collapse:collapse;font-size:.85rem}
  .ba-table th,.ba-table td{border:1px solid var(--border);padding:.5rem .6rem;text-align:left}
  .ba-table thead th{background:var(--surface-2);font-weight:600;text-align:center;white-space:nowrap}
  .ba-table tbody tr:nth-child(even){background:var(--surface-2)}
  .ba-table tbody tr.kosong{opacity:.4}
  .ba-table tbody tr.kosong td{font-style:italic;color:var(--text-3)}
  .ba-table .col-no{width:50px;text-align:center;font-weight:600}
  .ba-table .col-rank{width:50px;text-align:center;font-weight:700}
  .ba-table .col-undian{width:70px;text-align:center;font-weight:600}
  .ba-table .col-nilai{width:80px;text-align:right;font-variant-numeric:tabular-nums}
  .ba-table .col-status{width:80px;text-align:center}
  .ba-table .rank-1{color:#d4af37;font-weight:900}
  .ba-table .rank-2{color:#8a8a8a;font-weight:800}
  .ba-table .rank-3{color:#b87333;font-weight:800}

  .ba-footer{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border);font-size:.8rem;color:var(--text-2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}

  .tab-bar{display:flex;gap:.5rem;margin-bottom:1rem;padding:.3rem;background:var(--surface-2);border-radius:var(--r);overflow-x:auto}
  .tab-btn{padding:.5rem 1rem;border:none;background:transparent;color:var(--text-2);font-size:.85rem;font-weight:500;border-radius:calc(var(--r) - 4px);cursor:pointer;white-space:nowrap;transition:all .2s}
  .tab-btn:hover{background:var(--surface)}
  .tab-btn.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}

  /* Print Styles */
  @media print {
    body * { visibility: hidden; }
    .rekap-overlay, .rekap-overlay * { visibility: visible; }
    .rekap-overlay { position: absolute; inset: 0; background: white; display: block !important; padding: 0; }
    .rekap-modal { box-shadow: none; max-width: 100%; margin: 0; border-radius: 0; }
    .rekap-head { position: static; border: none; padding: .5rem; }
    .rekap-actions { display: none !important; }
    .rekap-body { max-height: none; overflow: visible; padding: .5rem; }
    .ba-table th, .ba-table td { border: 1px solid #333; padding: 4px; }
    .ba-table tbody tr:nth-child(even) { background: #f5f5f5 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .ba-table tbody tr.kosong { opacity: .3; }
    .ba-table .rank-1 { color: #000 !important; }
    .ba-table .rank-2 { color: #333 !important; }
    .ba-table .rank-3 { color: #555 !important; }
    @page { size: A4 landscape; margin: 1cm; }
  }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <div class="brand">
    <div class="brand-logo"><i data-lucide="shield-check"></i></div>
    <div><b id="hEvent">SPECTRA</b><small id="hCabang">Panel Operator</small></div>
  </div>
  <div class="topbar-actions">
    <span id="conn"></span>
    <button class="btn btn-ghost btn-icon" onclick="bukaRekap()" title="Lihat Rekap"><i data-lucide="file-spreadsheet"></i></button>
    <button class="btn btn-ghost btn-icon" onclick="muat()" title="Segarkan"><i data-lucide="refresh-cw"></i></button>
    <button class="btn btn-ghost btn-icon" onclick="toggleTheme()" title="Ganti tema"><i id="icTheme" data-lucide="moon"></i></button>
    <button class="btn btn-ghost btn-icon" onclick="keluarSpectra()" title="Keluar"><i data-lucide="log-out"></i></button>
  </div>
</div></header>

<main>
  <div class="stat-grid">
    <div class="stat"><i data-lucide="users"></i><div><b id="stP">0</b><small>Peserta</small></div></div>
    <div class="stat proc"><i data-lucide="pencil-line"></i><div><b id="stPr">0</b><small>Proses</small></div></div>
    <div class="stat ok"><i data-lucide="badge-check"></i><div><b id="stF">0</b><small>Final</small></div></div>
    <div class="stat warn"><i data-lucide="alert-triangle"></i><div><b id="stW">0</b><small>⚠ Juri</small></div></div>
  </div>
  <div class="alert alert-warn" id="warnBox" hidden><i data-lucide="alert-triangle"></i><span></span></div>

  <div class="matrix-wrap"><table class="matrix"><thead id="mHead"></thead><tbody id="mBody"></tbody></table></div>
  <div class="cards" id="cards"></div>
  <div class="card empty" id="empty" hidden><i data-lucide="clipboard-list"></i><p>Belum ada peserta di ruang ini.</p></div>
  <div class="card" id="fatal" hidden><p id="fatalTxt" class="muted"></p>
    <button class="btn btn-primary btn-block" onclick="location.href='spectra-login.html'">Ke Halaman Login</button></div>
</main>

<div class="bottombar"><div class="bottombar-in" style="align-items:center">
  <div style="flex:1;font-size:.83rem;color:var(--text-2)" id="ringkasan">Memuat...</div>
  <button class="btn btn-ghost" onclick="bukaRekap()" style="margin-right:.5rem">
    <i data-lucide="file-spreadsheet"></i><span>Rekap</span></button>
  <button class="btn btn-primary" id="btnBatch" disabled onclick="sahkanLengkap()">
    <i data-lucide="badge-check"></i><span>Sahkan Semua Lengkap</span></button>
</div></div>

<!-- Rekap Modal -->
<div class="rekap-overlay" id="rekapOverlay" onclick="if(event.target===this)tutupRekap()">
  <div class="rekap-modal">
    <div class="rekap-head">
      <h2><i data-lucide="file-spreadsheet"></i>Rekapitulasi Nilai</h2>
      <div class="rekap-actions">
        <button class="btn btn-ghost btn-sm" onclick="cetakRekap()"><i data-lucide="printer"></i><span>Cetak</span></button>
        <button class="btn btn-ghost btn-icon" onclick="tutupRekap()"><i data-lucide="x"></i></button>
      </div>
    </div>
    <div class="rekap-body" id="rekapBody">
      <p style="text-align:center;color:var(--text-2)">Memuat rekap...</p>
    </div>
  </div>
</div>

<script>
const sesi = bacaSesi();
let DATA = null, ROWS = [];
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fatal = m => { document.getElementById('fatal').hidden = false; document.getElementById('fatalTxt').textContent = m; };

(async function boot(){
  if (!sesi) { location.href = 'spectra-login.html'; return; }
  if (sesi.peran !== 'OPERATOR') return fatal('Halaman ini khusus OPERATOR. Sesi Anda: ' + sesi.peran + '.');
  document.getElementById('hEvent').textContent = sesi.nama_event;
  document.getElementById('hCabang').textContent =
    (sesi.nama_cabang || '') + (sesi.nama_kategori ? ' • ' + sesi.nama_kategori : '') + ' • Panel Operator';
  document.getElementById('icTheme').setAttribute('data-lucide', themeIcon());
  initConn('conn');
  await muat();
  setInterval(() => { if (navigator.onLine) muat(true); }, 45000);
})();

async function muat(senyap){
  try {
    const { data, error } = await (await sb()).rpc('spectra_get_operator_data', { p_kode_akses: sesi.kode_akses });
    if (error) throw error;
    if (data && data.error) return fatal(data.error);
    DATA = data; render();
  } catch (e) { if (!senyap) fatal('Gagal memuat data: ' + e.message); }
}

function render(){
  const juri = DATA.juri || [], peserta = DATA.peserta || [], nilai = DATA.nilai || [];
  const byP = {};
  nilai.forEach(n => { (byP[n.peserta_id] = byP[n.peserta_id] || {})[n.petugas_id] = n; });
  let nPr = 0, nFin = 0, nWarn = 0;
  ROWS = peserta.map(p => {
    const nm = byP[p.id] || {};
    const vals = Object.values(nm);
    const dinilai = vals.length;
    const nF = vals.filter(v => v.status === 'FINAL').length;
    const total = vals.reduce((a, v) => a + Number(v.total || 0), 0);
    const lengkap = juri.length > 0 && dinilai === juri.length;
    const allFinal = dinilai > 0 && nF === dinilai;
    if (allFinal) nFin++; else if (dinilai > 0) nPr++;
    if (dinilai > 0 && !lengkap) nWarn++;
    return { p, nm, dinilai, total, lengkap, allFinal };
  });
  document.getElementById('stP').textContent = peserta.length;
  document.getElementById('stPr').textContent = nPr;
  document.getElementById('stF').textContent = nFin;
  document.getElementById('stW').textContent = nWarn;
  const wb = document.getElementById('warnBox');
  if (nWarn > 0) { wb.hidden = false;
    wb.querySelector('span').textContent = nWarn + ' peserta belum dinilai lengkap ' + juri.length + ' juri.';
  } else wb.hidden = true;

  document.getElementById('mHead').innerHTML = '<tr><th>Peserta</th>' +
    juri.map(j => '<th>' + esc(j.nama_petugas) + '</th>').join('') +
    '<th>Total</th><th>Status</th><th style="text-align:center">Aksi</th></tr>';
  document.getElementById('mBody').innerHTML = ROWS.map(r =>
    '<tr><td><b>' + r.p.nomor_undian + '. ' + esc(r.p.nama_peserta) + '</b><br>' +
    '<small class="muted">' + esc(r.p.asal_instansi || '') + (r.p.nama_kategori ? ' • ' + esc(r.p.nama_kategori) : '') + '</small></td>' +
    juri.map(j => { const v = r.nm[j.id];
      return '<td>' + (v ? '<span class="mcell ' + (v.status === 'FINAL' ? 'final' : 'draft') + '">' + fmtN(v.total) + '</span>' : '<span class="mcell none">–</span>') + '</td>'; }).join('') +
    '<td class="tnum"><b>' + fmtN(r.total) + '</b></td>' +
    '<td><span class="badge ' + (r.allFinal ? 'ok' : r.dinilai ? 'proc' : 'none') + '">' + (r.allFinal ? 'FINAL' : r.dinilai ? 'PROSES' : 'BELUM') + '</span></td>' +
    '<td><div class="aksiCell">' + aksiBtn(r) + '</div></td></tr>').join('');

  document.getElementById('cards').innerHTML = ROWS.map(r =>
    '<div class="card"><div class="card-head"><div><h3 style="font-size:1rem">' + r.p.nomor_undian + '. ' + esc(r.p.nama_peserta) + '</h3>' +
    '<span class="muted small">' + esc(r.p.asal_instansi || '-') + (r.p.nama_kategori ? ' • ' + esc(r.p.nama_kategori) : '') + '</span></div>' +
    '<span class="badge ' + (r.lengkap ? 'ok' : 'warn') + '">Juri ' + r.dinilai + '/' + juri.length + '</span></div>' +
    '<div class="jChips">' + juri.map(j => { const v = r.nm[j.id];
      return '<span class="jChip ' + (v ? (v.status === 'FINAL' ? 'final' : 'draft') : '') + '">' + esc(j.nama_petugas) + ': ' + (v ? fmtN(v.total) : 'belum') + '</span>'; }).join('') + '</div>' +
    '<div class="pFoot"><div class="tot"><small>TOTAL GABUNGAN</small><b>' + fmtN(r.total) + '</b></div>' + aksiBtn(r, true) + '</div></div>').join('');

  document.getElementById('empty').hidden = peserta.length > 0;
  const batch = ROWS.filter(r => r.dinilai > 0 && r.lengkap && !r.allFinal);
  document.getElementById('btnBatch').disabled = batch.length === 0;
  document.getElementById('ringkasan').innerHTML = '<b>' + nFin + '</b> FINAL • <b>' + nPr + '</b> proses • <b>' + nWarn + '</b> ⚠ juri';
  icons();
}

function aksiBtn(r, lebar){
  const cls = lebar ? 'btn' : 'btn btn-icon';
  if (r.allFinal) return '<button class="' + cls + ' btn-warn" onclick="validasi(\'' + r.p.id + '\',\'DRAFT\')"><i data-lucide="lock-open"></i>' + (lebar ? '<span> Buka Kunci</span>' : '') + '</button>';
  if (r.dinilai > 0) return '<button class="' + cls + ' btn-primary" onclick="validasi(\'' + r.p.id + '\',\'FINAL\')"><i data-lucide="badge-check"></i>' + (lebar ? '<span> Sahkan Final</span>' : '') + '</button>';
  return '<button class="' + cls + ' btn-ghost" disabled><i data-lucide="minus"></i>' + (lebar ? '<span> Belum ada nilai</span>' : '') + '</button>';
}

async function validasi(pesertaId, status){
  const r = ROWS.find(x => x.p.id === pesertaId); if (!r) return;
  if (status === 'FINAL' && !r.lengkap) {
    const ok = await spectraConfirm({ judul: 'Juri belum lengkap',
      pesan: 'Peserta "' + r.p.nama_peserta + '" baru dinilai ' + r.dinilai + ' dari ' + (DATA.juri || []).length + ' juri. Sahkan tetap?',
      teksYa: 'Sahkan Tetap', bahaya: true });
    if (!ok) return;
  }
  if (status === 'DRAFT') {
    const ok = await spectraConfirm({ judul: 'Buka kunci?', pesan: 'Nilai "' + r.p.nama_peserta + '" akan kembali ke DRAFT dan hilang dari livescore.', teksYa: 'Buka Kunci' });
    if (!ok) return;
  }
  const { error } = await (await sb()).rpc('spectra_validasi_operator', {
    p_kode_akses: sesi.kode_akses, p_cabang_id: (DATA.cabang || {}).id, p_peserta_id: pesertaId, p_status: status });
  if (error) return toast('Gagal: ' + error.message, 'err');
  toast(status === 'FINAL' ? 'Nilai disahkan FINAL.' : 'Kunci dibuka.', 'ok');
  await muat(true);
}

async function sahkanLengkap(){
  const batch = ROWS.filter(r => r.dinilai > 0 && r.lengkap && !r.allFinal);
  if (!batch.length) return;
  const ok = await spectraConfirm({ judul: 'Sahkan ' + batch.length + ' peserta?',
    pesan: 'Hanya peserta dengan juri lengkap yang akan disahkan menjadi FINAL dan tampil di livescore.', teksYa: 'Sahkan Semua' });
  if (!ok) return;
  let n = 0;
  for (const r of batch) {
    const { error } = await (await sb()).rpc('spectra_validasi_operator', {
      p_kode_akses: sesi.kode_akses, p_cabang_id: (DATA.cabang || {}).id, p_peserta_id: r.p.id, p_status: 'FINAL' });
    if (!error) n++;
  }
  toast(n + ' peserta disahkan FINAL.', 'ok');
  await muat(true);
}

/* ========== REKAP / BERITA ACARA ========== */
let rekapMode = 'semua'; // 'semua', 'final', 'ranking'

function bukaRekap(){
  document.getElementById('rekapOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
  renderRekap();
  icons();
}

function tutupRekap(){
  document.getElementById('rekapOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

function cetakRekap(){
  window.print();
}

function setRekapMode(mode){
  rekapMode = mode;
  renderRekap();
}

function renderRekap(){
  if (!DATA) return;
  const juri = DATA.juri || [];
  const peserta = DATA.peserta || [];
  const nilai = DATA.nilai || [];
  const cabang = DATA.cabang || {};

  // Build score map
  const byP = {};
  nilai.forEach(n => { (byP[n.peserta_id] = byP[n.peserta_id] || {})[n.petugas_id] = n; });

  // Find max nomor_undian
  let maxUndian = 0;
  peserta.forEach(p => {
    const num = parseInt(p.nomor_undian) || 0;
    if (num > maxUndian) maxUndian = num;
  });

  // Build complete rows (1 to maxUndian)
  const completeRows = [];
  const pesertaByUndian = {};
  peserta.forEach(p => { pesertaByUndian[p.nomor_undian] = p; });

  for (let i = 1; i <= maxUndian; i++) {
    const p = pesertaByUndian[i] || pesertaByUndian[String(i)];
    if (p) {
      const nm = byP[p.id] || {};
      const vals = Object.values(nm);
      const dinilai = vals.length;
      const nF = vals.filter(v => v.status === 'FINAL').length;
      const total = vals.reduce((a, v) => a + Number(v.total || 0), 0);
      const lengkap = juri.length > 0 && dinilai === juri.length;
      const allFinal = dinilai > 0 && nF === dinilai;
      completeRows.push({ nomor: i, p, nm, dinilai, total, lengkap, allFinal, kosong: false });
    } else {
      completeRows.push({ nomor: i, p: null, nm: {}, dinilai: 0, total: 0, lengkap: false, allFinal: false, kosong: true });
    }
  }

  // Filter based on mode
  let displayRows = [...completeRows];
  if (rekapMode === 'final') {
    displayRows = completeRows.filter(r => r.allFinal);
  } else if (rekapMode === 'ranking') {
    displayRows = completeRows.filter(r => r.total > 0).sort((a, b) => b.total - a.total);
  }

  // Calculate stats
  const totalPeserta = peserta.length;
  const totalFinal = completeRows.filter(r => r.allFinal).length;
  const totalProses = completeRows.filter(r => r.dinilai > 0 && !r.allFinal).length;
  const totalKosong = completeRows.filter(r => r.kosong).length;

  // Current time
  const now = new Date();
  const tgl = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const waktu = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

  let html = '';

  // Header BA
  html += '<div class="ba-header">';
  html += '<h3>REKAPITULASI PENILAIAN</h3>';
  html += '<h4>' + esc(sesi.nama_event || 'SPECTRA') + '</h4>';
  if (cabang.nama_cabang || sesi.nama_cabang) {
    html += '<p>' + esc(cabang.nama_cabang || sesi.nama_cabang) + '</p>';
  }
  if (cabang.nama_kategori || sesi.nama_kategori) {
    html += '<p>Kategori: <b>' + esc(cabang.nama_kategori || sesi.nama_kategori) + '</b></p>';
  }
  html += '</div>';

  // Info Box
  html += '<div class="ba-info">';
  html += '<div><span>Total Peserta:</span> <b>' + totalPeserta + '</b></div>';
  html += '<div><span>Final:</span> <b>' + totalFinal + '</b></div>';
  html += '<div><span>Proses:</span> <b>' + totalProses + '</b></div>';
  html += '<div><span>Nomor Kosong:</span> <b>' + totalKosong + '</b></div>';
  html += '<div><span>Jumlah Juri:</span> <b>' + juri.length + '</b></div>';
  html += '<div><span>Waktu:</span> <b>' + waktu + '</b></div>';
  html += '</div>';

  // Tab Bar
  html += '<div class="tab-bar">';
  html += '<button class="tab-btn ' + (rekapMode === 'semua' ? 'active' : '') + '" onclick="setRekapMode(\'semua\')">Semua Nomor (' + maxUndian + ')</button>';
  html += '<button class="tab-btn ' + (rekapMode === 'final' ? 'active' : '') + '" onclick="setRekapMode(\'final\')">Hanya FINAL (' + totalFinal + ')</button>';
  html += '<button class="tab-btn ' + (rekapMode === 'ranking' ? 'active' : '') + '" onclick="setRekapMode(\'ranking\')">Per Ranking (' + completeRows.filter(r=>r.total>0).length + ')</button>';
  html += '</div>';

  // Table
  html += '<table class="ba-table">';
  html += '<thead><tr>';
  if (rekapMode === 'ranking') html += '<th class="col-rank">#</th>';
  html += '<th class="col-no">No</th>';
  html += '<th class="col-undian">Undian</th>';
  html += '<th>Nama Peserta</th>';
  html += '<th>Asal / Kontingen</th>';
  juri.forEach(j => {
    html += '<th class="col-nilai">' + esc(j.nama_petugas) + '</th>';
  });
  html += '<th class="col-nilai">Total</th>';
  html += '<th class="col-status">Status</th>';
  html += '</tr></thead><tbody>';

  if (displayRows.length === 0) {
    html += '<tr><td colspan="' + (rekapMode === 'ranking' ? 6 + juri.length : 5 + juri.length) + '" style="text-align:center;padding:2rem;color:var(--text-3)">Tidak ada data untuk ditampilkan.</td></tr>';
  } else {
    let rank = 0;
    displayRows.forEach((r, idx) => {
      if (r.kosong) {
        html += '<tr class="kosong">';
        if (rekapMode === 'ranking') html += '<td class="col-rank">-</td>';
        html += '<td class="col-no">' + r.nomor + '</td>';
        html += '<td class="col-undian">-</td>';
        html += '<td colspan="' + (2 + juri.length) + '" style="text-align:center;font-style:italic">— Nomor undian tidak terpakai —</td>';
        html += '<td class="col-status">-</td>';
        html += '</tr>';
      } else {
        rank++;
        let rankClass = '';
        if (rekapMode === 'ranking') {
          if (rank === 1) rankClass = 'rank-1';
          else if (rank === 2) rankClass = 'rank-2';
          else if (rank === 3) rankClass = 'rank-3';
        }

        html += '<tr>';
        if (rekapMode === 'ranking') {
          html += '<td class="col-rank ' + rankClass + '">' + rank + '</td>';
        }
        html += '<td class="col-no">' + r.nomor + '</td>';
        html += '<td class="col-undian">' + esc(r.p.nomor_undian) + '</td>';
        html += '<td><b>' + esc(r.p.nama_peserta) + '</b></td>';
        html += '<td>' + esc(r.p.asal_instansi || '-') + '</td>';

        juri.forEach(j => {
          const v = r.nm[j.id];
          if (v) {
            const st = v.status === 'FINAL' ? '✓ ' : '';
            html += '<td class="col-nilai">' + st + fmtN(v.total) + '</td>';
          } else {
            html += '<td class="col-nilai" style="color:var(--text-3)">-</td>';
          }
        });

        html += '<td class="col-nilai"><b>' + fmtN(r.total) + '</b></td>';

        let statusBadge = '';
        if (r.allFinal) statusBadge = '<span class="badge ok">FINAL</span>';
        else if (r.dinilai > 0) statusBadge = '<span class="badge proc">PROSES</span>';
        else statusBadge = '<span class="badge none">BELUM</span>';
        html += '<td class="col-status">' + statusBadge + '</td>';

        html += '</tr>';
      }
    });
  }

  html += '</tbody></table>';

  // Footer
  html += '<div class="ba-footer">';
  html += '<span>Dicetak: ' + tgl + ' pukul ' + waktu + ' WIB</span>';
  html += '<span>SPECTRA — Sistem Penilaian Digital</span>';
  html += '</div>';

  document.getElementById('rekapBody').innerHTML = html;
}

// Keyboard shortcut: Escape to close rekap
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && document.getElementById('rekapOverlay').classList.contains('show')) {
    tutupRekap();
  }
});
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVESCORE — SPECTRA</title>
<link rel="stylesheet" href="spectra-theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="spectra-ui.js"></script>
<script>initTheme('dark', true)</script> <!-- gelap terkunci untuk proyektor -->
<style>
  body{font-size:18px}
  .live{display:flex;gap:.45rem;align-items:center;color:#f87171;font-weight:800;font-size:.9rem}
  .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:pul 1.2s infinite}
  @keyframes pul{50%{opacity:.25}}
  table{min-width:680px}
  td{padding:1rem}
  .pos{font-size:1.5rem;font-weight:900;width:64px}
  tr.r1{background:linear-gradient(90deg,rgba(245,158,11,.16),transparent)}
  tr.r2{background:linear-gradient(90deg,rgba(148,163,184,.14),transparent)}
  tr.r3{background:linear-gradient(90deg,rgba(180,83,9,.14),transparent)}
  .stamp{color:var(--text-2);font-size:.82rem;margin:.7rem 0}
  footer{text-align:center;color:var(--text-3);font-size:.75rem;padding:1.6rem}
  .btn.on{border-color:var(--primary);color:var(--primary-text)}
</style>
</head>
<body>

<header class="topbar"><div class="topbar-in">
  <div class="brand">
    <div class="brand-logo"><i data-lucide="zap"></i></div>
    <div><b>SPECTRA</b><small id="hEvent">Memuat event...</small></div>
  </div>
  <div class="topbar-actions">
    <span class="live" id="liveBadge"><span class="dot"></span> LIVE</span>
    <button class="btn btn-ghost btn-icon" id="btnRot" onclick="toggleRot()" title="Rotasi cabang otomatis"><i data-lucide="rotate-cw"></i></button>
    <button class="btn btn-ghost btn-icon" id="btnLive" onclick="toggleLive()" title="Jeda/lanjutkan"><i data-lucide="pause"></i></button>
    <button class="btn btn-ghost btn-icon" onclick="muat()" title="Segarkan"><i data-lucide="refresh-cw"></i></button>
    <button class="btn btn-ghost btn-icon" onclick="layarPenuh()" title="Mode proyektor"><i data-lucide="maximize"></i></button>
  </div>
</div></header>

<main class="container" style="padding-top:1.1rem">
  <div class="toolbar" style="display:flex;gap:.7rem;flex-wrap:wrap">
    <select class="input" id="fCabang" onchange="render()" style="width:auto"></select>
    <select class="input" id="fKategori" onchange="render()" style="width:auto"></select>
  </div>
  <div class="stamp" id="stamp"></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Pos</th><th>No. Undi</th><th>Peserta & Instansi</th><th>Juri</th><th>Total Nilai</th><th>Status</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <div class="empty" id="empty" hidden>
    <i data-lucide="monitor"></i>
    <p>Belum ada nilai FINAL yang disahkan.<br>Klasemen muncul otomatis saat operator mengesahkan nilai.</p>
  </div>
</main>
<footer>© Tim Kreatif Selogiri — hanya menampilkan nilai yang sudah disahkan (FINAL).</footer>

<script>
let EVENT = null, CABANG = [], KATEGORI = [], NILAI = [];
let liveOn = true, timer = null, rotOn = false, rotIdx = 0, rotTimer = null;
const INTERVAL = 20;
const slugParam = new URLSearchParams(location.search).get('e');

async function muat() {
  try {
    const client = await sb();
    if (!EVENT) {
      if (slugParam) {
        const { data } = await client.from('spectra_events').select('*').eq('slug', slugParam).maybeSingle();
        EVENT = data;
      } else {
        const { data } = await client.from('spectra_events').select('*').order('created_at', { ascending: false }).limit(5);
        EVENT = (data || []).find(e => e.status === 'AKTIF') || (data || [])[0];
      }
      if (!EVENT) { document.getElementById('hEvent').textContent = 'Event tidak ditemukan.'; return; }
      document.getElementById('hEvent').textContent = EVENT.nama_event + ' • ' + EVENT.tahun;
      const [c, k] = await Promise.all([
        client.from('spectra_cabang').select('id, nama_cabang').eq('event_id', EVENT.id).eq('is_active', true).order('urutan'),
        client.from('spectra_kategori').select('id, nama_kategori').eq('event_id', EVENT.id).order('urutan')
      ]);
      CABANG = c.data || []; KATEGORI = k.data || [];
      document.getElementById('fCabang').innerHTML = '<option value="">🏆 Semua Cabang</option>' +
        CABANG.map(c => '<option value="' + c.id + '">' + c.nama_cabang + '</option>').join('');
      document.getElementById('fKategori').innerHTML = '<option value="">Semua Kategori</option>' +
        KATEGORI.map(k => '<option value="' + k.id + '">' + k.nama_kategori + '</option>').join('');
    }
    const { data, error } = await client.from('spectra_nilai')
      .select('cabang_id, kategori_id, peserta_id, total, spectra_peserta(nomor_undian, nama_peserta, asal_instansi, sort_key)')
      .eq('event_id', EVENT.id).eq('status', 'FINAL');
    if (error) throw error;
    NILAI = data || [];
    render();
  } catch (e) {
    document.getElementById('stamp').textContent = '⚠️ Gagal memuat: ' + e.message;
  }
}

function render() {
  const fc = document.getElementById('fCabang').value;
  const fk = document.getElementById('fKategori').value;
  const agg = {};
  NILAI.forEach(n => {
    if (fc && n.cabang_id !== fc) return;
    if (fk && n.kategori_id !== fk) return;
    const a = agg[n.peserta_id] = agg[n.peserta_id] || { p: n.spectra_peserta, total: 0, juri: 0 };
    a.total += Number(n.total || 0); a.juri++;
  });
  const rows = Object.values(agg).sort((a, b) => (b.total - a.total) ||
    String(a.p.sort_key || '').localeCompare(String(b.p.sort_key || '')));

  document.getElementById('tb').innerHTML = rows.map((r, i) => {
    const med = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
    return '<tr class="' + (i < 3 ? 'r' + (i + 1) : '') + '"><td class="pos">' + med + '</td>' +
      '<td class="tnum" style="font-size:1.1rem;font-weight:700">' + r.p.nomor_undian + '</td>' +
      '<td><div class="bx-name">' + r.p.nama_peserta + '</div><div class="muted" style="font-size:.85rem">' + (r.p.asal_instansi || '') + '</div></td>' +
      '<td class="tnum">' + r.juri + '</td><td class="bx-num" style="color:var(--primary-text)">' + r.total + '</td>' +
      '<td><span class="badge ok">FINAL</span></td></tr>';
  }).join('');
  document.getElementById('empty').hidden = rows.length > 0;
  document.getElementById('stamp').textContent = '🕐 Sinkron ' + new Date().toLocaleTimeString('id-ID') +
    ' • metode TOTAL • update tiap ' + INTERVAL + ' dtk' + (rotOn ? ' • rotasi cabang AKTIF' : '');
}

function toggleLive() {
  liveOn = !liveOn;
  document.getElementById('btnLive').innerHTML = '<i data-lucide="' + (liveOn ? 'pause' : 'play') + '"></i>';
  document.getElementById('liveBadge').style.opacity = liveOn ? 1 : .3;
  aturTimer(); icons();
}
function aturTimer() { clearInterval(timer); if (liveOn) timer = setInterval(muat, INTERVAL * 1000); }

function toggleRot() {
  rotOn = !rotOn;
  document.getElementById('btnRot').classList.toggle('on', rotOn);
  clearInterval(rotTimer);
  if (rotOn) rotTimer = setInterval(() => {
    rotIdx = (rotIdx + 1) % (CABANG.length + 1);
    document.getElementById('fCabang').value = rotIdx === 0 ? '' : CABANG[rotIdx - 1].id;
    render();
  }, 12000);
  render();
}
function layarPenuh() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
}

muat().then(aturTimer);
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPECTRA — Livescore</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="spectra-theme.css?v=2">
<script src="vendor/supabase.min.js"></script>
<script src="vendor/lucide.min.js"></script>
<script>if(!window.lucide) document.write('<script src="https://unpkg.com/lucide@latest"><\/script>')</script>
<script src="spectra-ui.js?v=2"></script>
<script>initTheme('dark')</script>
<style>
  main{max-width:1100px;margin:0 auto;padding:1rem}
  .live-head{text-align:center;margin-bottom:1rem}
  .live-head h1{font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:1px}
  .live-dot{display:inline-flex;align-items:center;gap:.4rem;color:var(--danger);font-weight:700;font-size:.8rem}
  .live-dot i{animation:kedip 1.2s infinite}
  @keyframes kedip{50%{opacity:.2}}
  .cab-tabs{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-bottom:.8rem}
  .cab-tabs button{border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-2);border-radius:99px;padding:.45rem 1rem;font-weight:700;cursor:pointer}
  .cab-tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .podium{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:1rem}
  .podium .card{text-align:center;padding:1rem .6rem}
  .podium .med{font-size:2rem}
  .podium .nm{font-weight:800;margin:.3rem 0}
  .podium .tot{font-size:1.3rem;color:var(--primary-text);font-weight:800}
  .board .row{display:grid;grid-template-columns:52px 60px 1fr auto;gap:.7rem;align-items:center;padding:.6rem .8rem;border-bottom:1px solid var(--border)}
  .board .row .rk{font-weight:800;font-size:1.05rem}
  .board .row .tot{font-weight:800;font-size:1.05rem;color:var(--primary-text)}
  @media(max-width:600px){.podium{grid-template-columns:1fr}.board .row{grid-template-columns:40px 44px 1fr auto}}
</style>
</head>
<body>
<main>
  <div class="live-head">
    <span class="live-dot"><i data-lucide="radio"></i> LIVE</span>
    <h1 id="evName">SPECTRA</h1>
    <span class="muted" id="evLoc"></span>
  </div>
  <div class="cab-tabs" id="cabTabs"></div>
  <div class="cab-tabs" id="katTabs"></div>
  <div class="podium" id="podium"></div>
  <div class="card board"><div id="board"></div></div>
</main>
<script>
let DATA=null, curCab=null, curKat=null;
const params=new URLSearchParams(location.search);
const slug=params.get('e');

(async function load(){
  try{
    const client=await sb();
    let evQ=client.from('spectra_events').select('*');
    evQ = slug ? evQ.eq('slug',slug) : evQ.eq('status','AKTIF');
    const ev=await evQ.maybeSingle();
    if(ev.error) throw ev.error;
    if(!ev.data){ document.getElementById('evName').textContent='Belum ada event AKTIF'; return; }
    const E=ev.data;
    document.getElementById('evName').textContent=E.nama_event;
    document.getElementById('evLoc').textContent=E.lokasi||'';
    const [cab,kat,pes,nil]=await Promise.all([
      client.from('spectra_cabang').select('*').eq('event_id',E.id).order('urutan'),
      client.from('spectra_kategori').select('*').eq('event_id',E.id).order('urutan'),
      client.from('spectra_peserta').select('*').eq('event_id',E.id).eq('is_active',true),
      client.from('spectra_nilai').select('peserta_id,cabang_id,kategori_id,total,status').eq('event_id',E.id).eq('status','FINAL')
    ]);
    DATA={E,cab:cab.data||[],kat:kat.data||[],pes:pes.data||[],nil:nil.data||[]};
    curCab=DATA.cab[0]?.id||null;
    renderTabs(); render();
    setInterval(load, 8000);
  }catch(e){ document.getElementById('evName').textContent='Gagal memuat: '+e.message; }
})();

function renderTabs(){
  el('cabTabs').innerHTML=DATA.cab.map(c=>'<button class="'+(c.id===curCab?'on':'')+'" onclick="setCab(\''+c.id+'\')">'+c.nama_cabang+'</button>').join('');
  const kats=DATA.kat;
  el('katTabs').innerHTML='<button class="'+(curKat==null?'on':'')+'" onclick="setKat(null)">Semua</button>'+
    kats.map(k=>'<button class="'+(curKat===k.id?'on':'')+'" onclick="setKat(\''+k.id+'\')">'+k.nama_kategori+'</button>').join('');
}
function setCab(id){ curCab=id; curKat=null; renderTabs(); render(); }
function setKat(id){ curKat=id; renderTabs(); render(); }

function totals(){
  const t={};
  (DATA.nil||[]).forEach(n=>{
    if(n.cabang_id!==curCab) return;
    if(curKat && n.kategori_id!==curKat) return;
    const m=t[n.peserta_id]=t[n.peserta_id]||{tot:0,n:0};
    m.tot+=Number(n.total||0); m.n++;
  });
  return t;
}
function render(){
  const cab=DATA.cab.find(c=>c.id===curCab)||{};
  const blind=!!cab.blind_judging;
  const t=totals();
  let rows=(DATA.pes||[]).filter(p=>p.cabang_id===curCab && (!curKat||p.kategori_id===curKat))
    .map(p=>({p, m:t[p.id]}))
    .filter(r=>r.m && r.m.n>0)
    .sort((a,b)=> b.m.tot-a.m.tot || a.p.nomor_undian-b.p.nomor_undian);
  const nama=p=> blind ? ('Peserta Nomor '+p.nomor_undian) : p.nama_peserta;
  const asal=p=> blind ? '' : (p.asal_instansi||'');
  const top=rows.slice(0,3);
  const med=['🥇','🥈','🥉'];
  el('podium').innerHTML=top.map((r,i)=>'<div class="card"><div class="med">'+med[i]+'</div><div class="nm">'+nama(r.p)+'</div>'+
    (asal(r.p)?'<span class="muted small">'+asal(r.p)+'</span>':'')+'<div class="tot">'+fmtN(r.m.tot)+'</div></div>').join('')||
    '<div class="card" style="grid-column:1/-1;text-align:center">Belum ada nilai FINAL.</div>';
  el('board').innerHTML=rows.map((r,i)=>'<div class="row"><span class="rk">'+(i+1)+'</span><span class="tnum">'+r.p.nomor_undian+
    '</span><span><b>'+nama(r.p)+'</b>'+(asal(r.p)?'<br><small class="muted">'+asal(r.p)+'</small>':'')+'</span><span class="tot">'+fmtN(r.m.tot)+'</span></div>').join('')||'';
  icons();
}
</script>
</body>
</html>
